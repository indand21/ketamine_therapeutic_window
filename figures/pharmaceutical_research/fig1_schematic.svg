   <g id="text_1">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(59.025144 38.20056)">Layer 0  Dosing regimen</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(73.473269 46.75581)">bolus or infusion</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(55.470144 92.400348)">Layer 1  Pharmacokinetics</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(43.910769 100.955598)">S- and R-ketamine, norketamine,</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(45.467644 109.534098)">hydroxynorketamine (calibrated)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(50.574519 154.246757)">Layer 2  Receptor occupancy</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(56.131394 162.802007)">pyramidal and interneuron</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(67.911394 171.357257)">open-channel block</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(258.758084 101.189204)">Layer 3a  Protective</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(248.090584 109.744454)">pyramidal block raises the</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(250.747459 118.299704)">spreading depolarization</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(277.876209 126.854954)">threshold</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(267.501209 189.086825)">Layer 3b  Toxic</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(249.862459 197.642075)">interneuron block causes</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(258.084334 206.103575)">disinhibition above a</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(277.876209 214.565075)">threshold</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(419.759188 153.256127)">Layers 4 and 5</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(429.326063 161.811377)">Net injury</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(426.431688 170.366627)">and clinical</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(437.110438 178.828127)">limits</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="359.069897" y="278.189087" transform="rotate(-0 359.069897 278.189087)">Emergent dose-response window</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="17.940226" y="16.008221" transform="rotate(-0 17.940226 16.008221)">Multiscale model of ketamine neuroprotection</text>
   </g>
  </g>
